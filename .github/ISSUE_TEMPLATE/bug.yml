name: Bug report
description: Report a reproducible problem without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, tokens, private URLs, request bodies, or personal data. Replace them with safe examples."
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include browser/OS, expected result, actual result, and the smallest safe steps.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Sanitized console output
      render: shell
